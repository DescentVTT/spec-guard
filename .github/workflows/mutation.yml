name: Mutation

# Mutation testing runs on every push. It was originally held back to a weekly
# schedule on the assumption that it would be slow, but the first real run took
# 6m54s on a hosted runner - fast enough to be a normal check rather than an
# occasional audit, and a mutation score is only useful if it is current.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can (vitest itself is pinned for exactly that reason - see
# ADR-0003), and filtering on src/** would miss it.
on:
  push:
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# A push to a branch that also has an open pull request triggers both events.
# Keying the group on the PR number when there is one collapses those into a
# single run, and cancels superseded runs when commits arrive in quick
# succession.
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: stryker
    runs-on: ubuntu-latest
    # Measured at ~7 minutes when the suite had few hanging mutants; timeouts
    # dominate the rest. This cap is headroom for a bad day, not a budget: on a
    # per-push workflow a hung job should fail fast, not hold a runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The config's concurrency of 8 is tuned for a developer machine.
      # Hosted runners have 4 vCPUs, and each Stryker worker drives a vitest
      # process of its own, so oversubscribing here makes the run slower.
      - name: Mutation test
        run: npx stryker run --concurrency 4

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
