name: Mutation

# Mutation testing in two tiers, with the full sweep split into shards.
#
# The full sweep is the number that counts, and it is not cheap: 15m51s at
# 3,493 mutants before 0.5.0, 42m39s at 7,763 in 0.9.0, growing with every
# module. Running it on every push to every branch was affordable when the suite
# was 2,118 mutants and 6m54s; it is the kind of cost that stops being
# affordable quietly, and by then the usual response is to lower the gate.
#
# So: pull requests run Stryker in incremental mode, which reuses the verdicts
# for mutants whose source and covering tests are both unchanged. main, the
# weekly schedule and any manual run do the full sweep and publish the
# incremental file the pull requests start from.
#
# The honest caveat, which belongs in the file rather than in a footnote: an
# incremental result is only as trustworthy as its cache. Stryker invalidates on
# file hashes, so it is sound as far as it goes, but "as far as it goes" is a
# heuristic and the full run is not. The gate is enforced in both tiers, so a
# pull request cannot get worse unnoticed - and every push to main re-derives the
# score from scratch, so nothing stays merged on a cached verdict for longer
# than one run.
#
# Both tiers run in shards. One runner stopped finishing the full sweep: 42m39s
# against a 45-minute limit on f83a743, and the same source on a slower runner
# was cancelled at 45 minutes with 7,044 of 7,763 mutants tested. Runners vary
# by a fifth or more on identical work, so a sweep near the limit fails about as
# often as it passes. The limit was not raised; the sweep was split. Each shard
# mutates its own files (scripts/mutation-shards.mjs) with every test, and a
# final job merges the reports, refuses anything that is not exactly one sweep,
# and applies the gate to the merged score. ADR-0003 has the measurements.
#
# There is no paths filter. A dependency bump can move the score as easily as a
# source edit can (vitest itself is pinned for exactly that reason - see
# ADR-0003), and filtering on src/** would miss it.
on:
  # A pull request's sweep gates it, and main's feeds the release commit
  # (ADR-0019). A push to any other branch runs nothing: one with a pull
  # request would run the sweep twice, once per event. A v* tag runs the
  # incremental tier on the commit it names.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full sweep even on a branch'
        type: boolean
        default: true

# A newer push to main supersedes an older push's run, and a newer commit on a
# pull request its older one, so those cancel. Nothing a push does supersedes a
# schedule or a dispatch, so the event is part of the key: without it, on
# 2026-09-14, the Monday sweep cancelled the full sweep of the push to main it
# shared a commit with, the sweep a release waits for (ADR-0019).
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Nothing here writes to the repository. The artifact and cache steps below
# authenticate to their own services, not with this token.
permissions:
  contents: read

jobs:
  shard:
    # The name says which tier ran, so a green tick in the checks list cannot be
    # mistaken for an authority it does not have.
    name: stryker (${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.full) && 'full' || 'incremental' }}, shard ${{ matrix.shard }} of ${{ strategy.job-total }})
    runs-on: ubuntu-latest
    # Headroom for a bad day, not a budget. Three shards took 19 to 21 minutes
    # on the second sharded sweep's runners, which is why there were four; on
    # 398fe94's sweep three of those four took 23 to 28 minutes and the fourth
    # was cancelled here, which is why there are eight. If shards keep passing
    # 20 minutes, move files between them or add one; the history of this
    # number (30, then 45, then a coin flip at 45) is why it is not raised.
    timeout-minutes: 30

    strategy:
      # One broken shard should not hide what the others found. The merge
      # refuses to score a sweep with a shard missing either way.
      fail-fast: false
      matrix:
        # One entry per shard in scripts/mutation-shards.mjs; a test checks.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]

    env:
      FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.full }}
      MUTATION_SHARD: ${{ matrix.shard }}

    steps:
      # Pinned to commits, with the tag beside each, because a tag can be
      # moved and a commit cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # A pull request starts from whatever main last published. The
      # restore-keys fallback matters more than the exact key: a run that finds
      # nothing simply does a full run and is correct, only slower. A full
      # sweep restores nothing: it re-derives every verdict from the code.
      - name: Restore the incremental file
        if: env.FULL != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      # The file holds the whole sweep, and Stryker reports the verdicts it
      # holds for files a run does not mutate as though the run had produced
      # them. The first sharded sweep did exactly that, and the merge refused
      # it. So each shard keeps only the files it mutates, and every test.
      - name: Keep this shard's part of the incremental file
        if: env.FULL != 'true'
        run: node scripts/mutation-shards.mjs cache "$MUTATION_SHARD"

      # The config's concurrency of 8 is tuned for a developer machine.
      # Hosted runners have 4 vCPUs, and each Stryker worker drives a vitest
      # process of its own, so oversubscribing here makes the run slower.
      - name: Mutation test
        run: |
          started=$SECONDS
          if [ "$FULL" = "true" ]; then
            npx stryker run stryker.shard.config.mjs --concurrency 4
          else
            npx stryker run stryker.shard.config.mjs --concurrency 4 --incremental
          fi
          echo "{\"seconds\": $((SECONDS - started))}" > "reports/mutation/shard-$MUTATION_SHARD.timing.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: reports/mutation/shard-${{ matrix.shard }}*.json
          if-no-files-found: error
          retention-days: 7

  score:
    name: mutation score (${{ (github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.full) && 'full' || 'incremental' }})
    needs: shard
    # Runs when a shard failed too, so the failure is reported as an incomplete
    # sweep rather than as a skipped check.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FULL: ${{ github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.full }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # The merge scores with Stryker's own metrics library.
      - run: npm ci

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          path: reports/shards

      - name: Merge the shards and apply the gate
        run: node scripts/mutation-shards.mjs merge reports/shards

      # Only a full sweep publishes a cache. An incremental run's file is
      # derived from a cache rather than from the code, and feeding that back in
      # is how a stale verdict would survive indefinitely.
      - name: Publish the incremental file
        if: env.FULL == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}

      - name: Say which tier ran
        if: always()
        run: |
          if [ "$FULL" = "true" ]; then
            echo "Full sweep: every mutant was re-run. This score is authoritative." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Incremental: mutants whose source and covering tests were both unchanged kept their previous verdict." >> "$GITHUB_STEP_SUMMARY"
            echo "The authoritative score is the full sweep on main." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mutation-report
          path: |
            reports/mutation/index.html
            reports/mutation/mutation.json
          if-no-files-found: ignore
