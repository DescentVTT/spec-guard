name: npm 12 (temporary)

# Temporary, and removed before this branch is reviewed: the suite, this
# repository's own checks and the release's own pack step under npm 12.2.0,
# which no Node carries yet, on the three platforms CI runs.
on:
  push:
    branches: [chore/npm-12-ready]

permissions:
  contents: read

jobs:
  npm-12:
    name: npm 12.2.0 (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['24']
        include:
          - os: ubuntu-latest
            node: '22'
          - os: ubuntu-latest
            node: '26'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: npm 12.2.0 in place of the npm Node carries
        run: |
          echo "node $(node --version) carries npm $(npm --version)"
          npm install -g npm@12.2.0
          test "$(npm --version)" = 12.2.0
      - run: npm ci --ignore-scripts
      - name: The install scripts npm 12 holds back, flag or no flag
        run: npm install-scripts ls || true
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Execute this repository's own specs
        run: node ./bin/spec-guard.js --verbose
      - name: Prove every rule in those specs can fail
        run: node ./bin/spec-guard.js prove
      - name: Check the ADRs the code's comments cite
        run: node ./bin/spec-guard.js cites
      - name: The release's own "Pack" step
        if: runner.os == 'Linux'
        run: |
          cat > "$RUNNER_TEMP/extract.cjs" <<'EOF'
          const fs = require('fs');
          const [file, step, out] = process.argv.slice(2);
          const lines = fs.readFileSync(file, 'utf8').split('\n');
          const start = lines.findIndex((line) => line.trim() === '- name: ' + step);
          const run = lines.findIndex((line, index) => index > start && line.trim() === 'run: |');
          const body = [];
          for (let index = run + 1; index < lines.length && (lines[index].startsWith('          ') || lines[index] === ''); index += 1) body.push(lines[index].slice(10));
          if (start === -1 || body.length === 0) throw new Error('no step named ' + step);
          fs.writeFileSync(out, body.join('\n'));
          EOF
          node "$RUNNER_TEMP/extract.cjs" .github/workflows/release.yml "Pack" "$RUNNER_TEMP/pack-step.sh"
          cat "$RUNNER_TEMP/pack-step.sh"
          bash -e "$RUNNER_TEMP/pack-step.sh"
          cat "$GITHUB_OUTPUT"
      - name: The tarball, installed as a user installs it
        if: runner.os == 'Linux'
        run: |
          tarball="$PWD/$(ls npm-package/*.tgz)"
          mkdir "$RUNNER_TEMP/user"
          cd "$RUNNER_TEMP/user"
          printf '{ "name": "user", "version": "1.0.0", "private": true }\n' > package.json
          npm install "$tarball"
          npx --no-install spec-guard --version
