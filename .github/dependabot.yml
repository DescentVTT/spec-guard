# Dependency updates, a pull request at a time, for the devDependencies and
# the GitHub Actions the workflows pin by commit.
#
# Latest is not newest. A version waits out a cooldown before a pull request
# proposes it - a week for a patch, two for a minor, a month for a major - so a
# release that is withdrawn or compromised in its first days never lands, and
# the pins stay the newest that have been out long enough to trust. Security
# updates are not held back: the cooldown applies to version updates only.
#
# Dependabot tells a patch from a major for npm but not for GitHub Actions,
# where it ignores the semver keys: an action waits a week whatever its
# version says. `default-days` is also the wait for an npm version Dependabot
# cannot place on semver. Unset, both would wait its built-in three days.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30
    # Stryker's packages and vitest's move together or not at all: a runner
    # a version apart from its core is a sweep that measures nothing.
    groups:
      stryker:
        patterns:
          - '@stryker-mutator/*'
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
    # @types/node follows the oldest Node that `engines` in package.json
    # admits, 22, and not the newest Node there is (spec-core's ADR-0008).
    # Under the types of a later major the code can call an API Node 22 does
    # not have, and the compiler passes what the oldest runtime then fails. So
    # a major is never proposed, while minors and patches of 22 still are. The
    # pin moves by hand, in the change that moves `engines`.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
  # Dependabot moves the pins in .github/workflows and reads no Markdown. The
  # README shows workflows with the same actions, and
  # tests/action-pins.test.ts holds each to the pin the workflows here have.
  # So a bump of checkout, setup-node or upload-sarif fails that test until
  # the README follows: copy the new commit and version into its `uses:`
  # line, on Dependabot's branch. spec-core's docs/adopting.md and
  # spec-graph's README show upload-sarif too, and no workflow of theirs runs
  # it: when it moves here, move it there by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
